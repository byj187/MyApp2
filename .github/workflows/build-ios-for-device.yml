name: Build iOS App for Real Device

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-device:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.11.1

      - name: List all available Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --all 2>&1 | grep -E "(ios|arm|framework)" | head -50

      - name: Build iOS Framework for Device (ARM64)
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tail -100

      - name: List build output
        run: |
          find composeApp/build -name "*.framework" -type d 2>/dev/null || find composeApp/build -type d -name "framework" 2>/dev/null || ls -la composeApp/build/bin/ 2>/dev/null || echo "Build output not found"

      - name: Build iOS App for Device
    run: |
      cd iosapp
      xcodebuild -project iosApp.xcodeproj \
        -scheme iosApp \
        -configuration Debug \
        -destination 'generic/platform=iOS' \
        -derivedDataPath ./build \
        build \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO

  - name: Create IPA for iOS Device
    run: |
      cd iosapp
      mkdir -p output
      
      # Find the .app file
      APP_PATH=$(find build/Build/Products/Debug-iphoneos -name "*.app" -type d | head -1)
      
      if [ -z "$APP_PATH" ]; then
        echo "Error: No .app file found!"
        ls -la build/Build/Products/Debug-iphoneos
        exit 1
      fi
      
      echo "Found app at: $APP_PATH"
      
      # Copy the app to output directory
      cp -r "$APP_PATH" ./output/
      
      cd output
      
      # Create Payload directory and copy app
      mkdir -p Payload
      APP_NAME=$(basename "$APP_PATH")
      mv "$APP_NAME" Payload/
      
      # Create IPA
      zip -r ../iosApp-device.zip Payload
      
      cd ..
      
      echo "IPA created successfully"
      ls -la iosApp-device.zip

      - name: Verify IPA was created
    run: |
      ls -la iosapp/*.zip 2>/dev/null || echo "IPA not found"
      ls -la iosapp/output/ 2>/dev/null || echo "Output dir not found"

  - name: Upload iOS Device Build
    uses: actions/upload-artifact@v4
    with:
      name: ios-app-device
      path: iosapp/iosApp-device.zip
      retention-days: 90

      - name: Print download link
        run: |
          echo "======================================"
          echo "🎉 BUILD SUCCESSFUL!"
          echo "======================================"
          echo ""
          echo "📥 Download IPA from:"
          echo "https://github.com/byj187/anxincaiguan/actions/runs/${{ github.run_id }}/artifacts"
          echo ""
          echo "📱 Install using AltStore:"
          echo "1. Download the ios-app-device.zip artifact"
          echo "2. Unzip it to get iosApp-device.ipa"
          echo "3. Open with AltStore on your iPhone"
          echo ""
          echo "======================================"