name: Build iOS App for Real Device

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-device:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.11.1

      - name: Build iOS ARM64 framework
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --no-daemon

      - name: Find and copy ComposeApp framework
        run: |
          echo "=== Searching for framework ==="
          FRAMEWORK_PATH=$(find composeApp/build -name "ComposeApp.framework" -type d | head -1)
          echo "Found framework at: $FRAMEWORK_PATH"
          
          if [ -z "$FRAMEWORK_PATH" ] || [ ! -d "$FRAMEWORK_PATH" ]; then
            echo "❌ Framework not found!"
            echo "Listing build contents:"
            ls -la composeApp/build/ 2>/dev/null
            ls -la composeApp/build/bin/ 2>/dev/null
            ls -la composeApp/build/bin/iosArm64/ 2>/dev/null
            find composeApp/build -name "*.framework" -type d 2>/dev/null
            exit 1
          fi
          
          echo "✅ Framework found!"
          mkdir -p iosApp/Frameworks
          cp -r "$FRAMEWORK_PATH" iosApp/Frameworks/ComposeApp.framework
          echo "✅ Framework copied!"
          ls -la iosApp/Frameworks/

      - name: Verify framework
        run: |
          echo "=== Checking iosApp directory ==="
          ls -la iosApp/
          echo "=== Checking Frameworks directory ==="
          ls -la iosApp/Frameworks/ 2>/dev/null || echo "Frameworks directory doesn't exist yet"
          echo "=== Checking ComposeApp.framework contents ==="
          if [ -d "iosApp/Frameworks/ComposeApp.framework" ]; then
            ls -la iosApp/Frameworks/ComposeApp.framework/
            ls -la iosApp/Frameworks/ComposeApp.framework/Headers/ 2>/dev/null
          fi

      - name: Build iOS App with Xcode
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

      - name: Create IPA file
        run: |
          cd iosApp
          mkdir -p output
          
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found!"
            ls -la build/Build/Products/Debug-iphoneos 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          cp -r "$APP_PATH" output/
          
          cd output
          mkdir -p Payload
          mv "$(basename "$APP_PATH")" Payload/
          
          zip -r ../iosApp-device.zip Payload
          
          cd ..
          echo "✅ IPA created!"
          ls -la iosApp-device.zip

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-device
          path: iosApp/iosApp-device.zip
          retention-days: 90

      - name: Print download link
        run: |
          echo "======================================"
          echo "🎉 BUILD SUCCESSFUL!"
          echo "======================================"
          echo ""
          echo "📥 Download IPA from:"
          echo "https://github.com/byj187/anxincaiguan/actions/runs/${{ github.run_id }}/artifacts"
          echo ""
          echo "📱 Install using AltStore:"
          echo "1. Download the ios-app-device.zip artifact"
          echo "2. Unzip it to get iosApp-device.ipa"
          echo "3. Open with AltStore on your iPhone"
          echo ""
          echo "======================================"
