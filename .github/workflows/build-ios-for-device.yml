name: Build iOS App for Real Device

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios-device:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.11.1

      - name: List all available Gradle tasks
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --all 2>&1 | grep -E "(ios|arm|framework)" | head -50

      - name: Build iOS Framework for Device (ARM64)
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tail -100

      - name: List build output
        run: |
          ls -la composeApp/build/bin/iosArm64/debugFramework/

      - name: Build iOS App for Device
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA for iOS Device
        run: |
          cd iosApp
          mkdir -p output
          find build/Build/Products/Debug-iphoneos -name "*.app" -type d -maxdepth 1 > app_path.txt
          APP_PATH=$(cat app_path.txt)
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" ./output/
          cd output
          ln -s "$APP_NAME" Payload
          zip -r ../iosApp-device.zip Payload
          cd ..
          echo "IPA created successfully"

      - name: Upload iOS Device Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-device
          path: iosApp/iosApp-device.zip