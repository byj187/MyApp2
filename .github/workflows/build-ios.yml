name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.11.1

      - name: Build iOS Framework
        run: |
          cd composeApp
          ./gradlew linkDebugFrameworkIosArm64 --no-daemon

      - name: Build iOS App
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ./build build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd iosApp
          mkdir -p output
          cp -r build/Build/Products/Debug-iphonesimulator/*.app ./output/
          cd output
          zip -r ../iosApp.zip *.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: iosApp/output/iosApp.zip